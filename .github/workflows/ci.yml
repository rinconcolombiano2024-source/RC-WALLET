name: RC Wallet CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Node and npm versions
        run: node --version && npm --version && npm ls --depth=0
      - name: Check JavaScript module syntax
        run: |
          for file in api/*.js src/*.js vite.config.js; do node --check "$file"; done
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # npm registry advisory API occasionally returns HTTP 503; retry the
      # same security gate, but NEVER downgrade or ignore a failing audit.
      - name: Security audit (bounded retries, fail closed)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Security audit attempt ${attempt}/3"
            if npm audit --audit-level=high --fetch-retries=0 --fetch-timeout=25000; then
              echo "Security audit passed"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "::error::Security audit did not pass after three attempts; release stays blocked."
          exit 1
