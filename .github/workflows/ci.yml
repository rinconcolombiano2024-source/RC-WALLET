name: RC Wallet CI

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Install, tests, build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - name: Verify committed npm lockfile
        run: test -s package-lock.json
      - name: Clean, reproducible install
        run: npm ci --no-fund
      - name: Check JavaScript syntax
        run: |
          for file in api/*.js src/*.js vite.config.js; do
            node --check "$file"
          done
      - name: Test without broadcasting transactions
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
