name: Generate npm lockfile
# One-time bootstrap for this feature branch; npm creates the lockfile.
# Remove this workflow once package-lock.json has been reviewed and merged.
on:
  push:
    branches:
      - engineering/rc-wallet-hardening-20261013
permissions:
  contents: write
concurrency:
  group: rc-wallet-lockfile-bootstrap
  cancel-in-progress: false
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize feature branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - name: Generate complete npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit generated lockfile only when changed
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: generate reproducible package-lock with npm'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
