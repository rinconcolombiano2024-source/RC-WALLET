# Temporary: only generates the missing lockfile with npm on a feature branch.
# Remove this workflow once the generated lockfile has been committed.
name: Bootstrap RC Wallet npm lockfile
on:
  push:
    branches:
      - audit/secure-build-and-wallet-flow-20261013

jobs:
  bootstrap:
    if: github.repository == 'rinconcolombiano2024-source/RC-WALLET'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Generate missing lockfile with the official package manager
        run: |
          if test -s package-lock.json; then
            echo "Lockfile already exists. No action."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit npm-generated reproducible lockfile"
          git push origin HEAD:audit/secure-build-and-wallet-flow-20261013
